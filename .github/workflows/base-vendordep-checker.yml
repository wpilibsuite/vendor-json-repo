# This workflow runs the JSON checker on each vendordep JSON file.

name: Weekly Vendordep Availability Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * Sat" # 11:15PM EST every Friday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "run-json-checker"
  run-json-checker:
    if: github.repository_owner == 'wpilibsuite'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Fetch all history so we can use git diff

    - name: Run check
      run: bazel test //... -k --config=ci
